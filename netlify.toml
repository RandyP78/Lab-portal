[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  included_files = ["netlify/functions/forms-blank/*.pdf"]

[dev]
  command = "npm run dev"
  functions = "netlify/functions"
  port = 3000

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200